        // Radardiagram component - verbeterd voor betere leesbaarheid
        const RadarChart = ({ scores, labels, title, color = "#1E88E5", fillColor = "rgba(30, 136, 229, 0.3)" }) => {
          const viewBoxSize = 300;
          const center = viewBoxSize / 2;
          const radius = 90;
          const labelRadius = 120;

          const getCoordinates = (index, value, total, customRadius = radius) => {
            const angle = (Math.PI * 2 * index) / total - Math.PI / 2;
            const r = (value / 10) * customRadius; // Nu op schaal 1-10
            return {
              x: center + r * Math.cos(angle),
              y: center + r * Math.sin(angle)
            };
          };

          const createPath = (values) => {
            return values.map((value, i) => {
              const coord = getCoordinates(i, value, values.length);
              return `${i === 0 ? 'M' : 'L'} ${coord.x} ${coord.y}`;
            }).join(' ') + ' Z';
          };

          // Korte labels voor in de chart
          const shortLabels = [

            "Bekwaam", 
            "Lespraktijk",
            "Inhoud",
            "Randvw.",
            "Borging"
          ];

                      }).join(' ')}
                      fill="none"
                      stroke="#E5E7EB"
                      strokeWidth="1"

                    {/* Nummers op de eerste as (boven) */}

                      x={center}
                      y={center - (level / 10) * radius - 3}
                      textAnchor="middle"
                      style={{ fontSize: '8px', fill: '#9CA3AF', fontWeight: '500' }}
                    >
                      {level}
                    </text>
                  </g>
                ))}

                {/* Assen */}
                {scores.map((_, i) => {
                  const coord = getCoordinates(i, 5, scores.length);
                  return (
                    <line
                      key={i}
                      x1={center}
                      y1={center}
                      x2={coord.x}
                      y2={coord.y}
                      stroke="#E5E7EB"
                      strokeWidth="1"
                    />
                  );
                })}

                <path
                  d={createPath(scores)}
                  fill={fillColor}
                  stroke={color}
                  strokeWidth="2"
                />

                {/* Score punten */}
                {scores.map((score, i) => {
                  const coord = getCoordinates(i, score, scores.length);
                  return (
                    <circle
                      key={i}
                      cx={coord.x}
                      cy={coord.y}
                      r="4"
                      fill={color}
                      stroke="white"
                      strokeWidth="1.5"
                    />
                  );
                })}

                {shortLabels.map((label, i) => {
                  const angle = (Math.PI * 2 * i) / shortLabels.length - Math.PI / 2;
                  const x = center + labelRadius * Math.cos(angle);
                  const y = center + labelRadius * Math.sin(angle);
                  
                  // Bepaal text-anchor gebaseerd op positie
                  let textAnchor = 'middle';
                  if (x < center - 10) textAnchor = 'end';
                  else if (x > center + 10) textAnchor = 'start';
                  
                  return (

                      key={i}
                      x={x}
                      y={y}
                      textAnchor={textAnchor}
                      dominantBaseline="middle"
                      style={{ fontSize: '9px', fill: '#374151', fontWeight: '600' }}

            </div>
          );
        };

        // Hoofdcomponent
        function NulmetingDigitaleGeletterdheid() {
          const [pagina, setPagina] = useState('intro');
          const [huidigThema, setHuidigThema] = useState(0);
          const [antwoorden, setAntwoorden] = useState({});
          const [toonVergelijking, setToonVergelijking] = useState(false);
          const [akkoord, setAkkoord] = useState(false);
          const [bouw, setBouw] = useState('');

          const voortgangPerThema = useMemo(() => {
            return themas.map(thema => {
              const beantwoord = thema.vragen.filter(v => antwoorden[v.id] !== undefined).length;
              return (beantwoord / thema.vragen.length) * 100;
            });
          }, [antwoorden]);

          // Scores worden berekend als gemiddelde van antwoorden (1-5) en vermenigvuldigd met 2 voor 1-10 schaal
          const scoresPerThema = useMemo(() => {
            return themas.map(thema => {
              const scores = thema.vragen
                .filter(v => antwoorden[v.id] !== undefined)
                .map(v => antwoorden[v.id]);
              if (scores.length === 0) return 0;
              return (scores.reduce((a, b) => a + b, 0) / scores.length) * 2; // *2 voor 1-10 schaal
            });
          }, [antwoorden]);

          const ikScoresPerThema = useMemo(() => {
            return themas.map(thema => {
              const ikVragen = thema.vragen.filter(v => v.type === 'ik');
              const scores = ikVragen
                .filter(v => antwoorden[v.id] !== undefined)
                .map(v => antwoorden[v.id]);
              if (scores.length === 0) return 0;
              return (scores.reduce((a, b) => a + b, 0) / scores.length) * 2; // *2 voor 1-10 schaal
            });
          }, [antwoorden]);

          const schoolScoresPerThema = useMemo(() => {
            return themas.map(thema => {
              const schoolVragen = thema.vragen.filter(v => v.type === 'school');
              const scores = schoolVragen
                .filter(v => antwoorden[v.id] !== undefined)
                .map(v => antwoorden[v.id]);
              if (scores.length === 0) return 0;
              return (scores.reduce((a, b) => a + b, 0) / scores.length) * 2; // *2 voor 1-10 schaal
            });
          }, [antwoorden]);

          const passendeRoute = useMemo(() => {
            if (scoresPerThema.every(s => s === 0)) return null;
            
            const minScore = Math.min(...scoresPerThema.filter(s => s > 0));
            const laagsteThemaIndex = scoresPerThema.findIndex(s => s === minScore);
            
            // Thresholds aangepast naar 1-10 schaal (origineel *2)
            if (laagsteThemaIndex === 0 || scoresPerThema[0] < 5.2) {
              return routes[0];
            }
            if (scoresPerThema[1] < 5.6 && scoresPerThema[0] >= 5.2) {
              return routes[1];
            }
            if (scoresPerThema[2] < 6.0 && scoresPerThema[0] >= 5.2 && scoresPerThema[1] >= 5.2) {
              return routes[2];
            }
            if (scoresPerThema[3] < 6.0 && scoresPerThema[0] >= 5.2 && scoresPerThema[1] >= 5.2 && scoresPerThema[2] >= 5.2) {
              return routes[3];
            }
            if (scoresPerThema[4] < 6.0 && Math.max(scoresPerThema[0], scoresPerThema[1]) >= 6.0) {
              return routes[4];
            }
            if (Math.min(scoresPerThema[0], scoresPerThema[1], scoresPerThema[2], scoresPerThema[3]) >= 6.8 && scoresPerThema[5] < 6.4) {
              return routes[5];
            }
            
            return routes[Math.min(laagsteThemaIndex, routes.length - 1)];
          }, [scoresPerThema]);

          const alleVragenBeantwoord = useMemo(() => {
            const totaalVragen = themas.reduce((acc, t) => acc + t.vragen.length, 0);
            return Object.keys(antwoorden).length === totaalVragen;
          }, [antwoorden]);

          const handleAntwoord = (vraagId, score) => {
            setAntwoorden(prev => ({ ...prev, [vraagId]: score }));
          };

          // Intro pagina
          if (pagina === 'intro') {
            return (
              <div style={{ 
                minHeight: '100vh', 
                background: 'linear-gradient(135deg, #1E88E5 0%, #26A69A 100%)',

                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'

                <div style={{ 
                  maxWidth: '800px', 
                  margin: '0 auto', 
                  background: 'white', 
                  borderRadius: '24px', 
                  padding: '24px',
                  boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)'

                  <h1 style={{ 
                    fontSize: '1.8rem', 
                    fontWeight: '700', 
                    color: '#1E88E5', 
                    marginBottom: '12px',
                    textAlign: 'center'
                  }}>
                    Nulmeting Digitale Geletterdheid
                  </h1>
                  <p style={{ 
                    color: '#6B7280', 
                    textAlign: 'center', 
                    marginBottom: '24px',
                    fontSize: '1rem'
                  }}>
                    Voor leerkrachten in het basisonderwijs
                  </p>

                  <div style={{ 
                    background: '#F9FAFB', 
                    borderRadius: '16px', 
                    padding: '20px', 
                    marginBottom: '24px' 
                  }}>

                      Wat kun je verwachten?
                    </h2>
                    <ul style={{ color: '#4B5563', lineHeight: '1.8', paddingLeft: '20px', margin: 0 }}>
                      <li><strong>60 stellingen</strong> verdeeld over 6 thema's</li>
                      <li>Score per stelling van <strong>1 (helemaal niet) tot 5 (helemaal wel)</strong></li>
                      <li>Direct inzicht in je <strong>sterke punten en groeikansen</strong></li>
                      <li>Vergelijking tussen <strong>individueel (ik)</strong> en <strong>teamperspectief (school)</strong></li>

                      fontWeight: '600', 
                      color: '#1E88E5', 
                      marginBottom: '12px',
                      fontSize: '0.95rem'
                    }}>
                      In welke bouw werk je? *
                    </label>
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>

                        </button>

                    </div>
                  </div>

                  {/* Akkoord dataverwerking */}
                  <div style={{ 
                    background: '#F0FDF4',

                    marginBottom: '24px',
                    border: '2px solid #26A69A'

                      gap: '12px',
                      cursor: 'pointer'
                    }}>
                      <input 
                        type="checkbox"

                      />
                      <span style={{ color: '#374151', fontSize: '0.9rem', lineHeight: '1.5' }}>
                        <strong style={{ color: '#26A69A' }}>Akkoord met dataverwerking *</strong><br/>
                        Ik ga akkoord dat mijn antwoorden worden opgeslagen en gebruikt voor het genereren van inzichten en schoolbrede analyses.
                      </span>
                    </label>
                  </div>

                  <button
                    onClick={() => setPagina('invullen')}
                    disabled={!akkoord || !bouw}

                      width: '100%',
                      padding: '16px 32px',
                      fontSize: '1.1rem',
                      fontWeight: '600',
                      color: 'white',

                </div>

          }

          // Invullen pagina
          if (pagina === 'invullen') {

                      </div>

                      <div style={{

                        gap: '6px',
                        flexWrap: 'nowrap'
                      }}>
                        {[1, 2, 3, 4, 5].map(score => (
                          <button
                            key={score}
                            onClick={() => handleAntwoord(vraag.id, score)}
                            style={{
                              flex: '1',
                              minWidth: '40px',
                              padding: '12px 4px',

                                ? `2px solid ${thema.kleur}` 
                                : '2px solid #E5E7EB',
                              background: antwoorden[vraag.id] === score 
                                ? thema.kleur 
                                : 'white',
                              color: antwoorden[vraag.id] === score 
                                ? 'white' 
                                : '#374151',
                              fontWeight: '600',
                              fontSize: '1rem',
                              cursor: 'pointer'
                            }}
                          >
                            {score}
                          </button>
                        ))}
                      </div>
                      <div style={{

                        justifyContent: 'space-between',
                        marginTop: '8px',
                        fontSize: '0.75rem',
                        color: '#9CA3AF'
                      }}>
                        <span>Helemaal niet</span>
                        <span>Helemaal wel</span>
                      </div>
                    </div>
                  ))}

                  <div style={{ 
                    display: 'flex', 
                    gap: '12px', 
                    marginTop: '24px',
                    flexWrap: 'wrap'
                  }}>
                    {huidigThema > 0 && (
                      <button
                        onClick={() => { setHuidigThema(huidigThema - 1); window.scrollTo(0, 0); }}
                        style={{
                          flex: 1,
                          minWidth: '120px',
                          padding: '14px 24px',
                          borderRadius: '10px',
                          border: '2px solid #E5E7EB',
                          background: 'white',
                          color: '#374151',
                          fontWeight: '600',
                          cursor: 'pointer'
                        }}
                      >
                        ← Vorige thema
                      </button>
                    )}
                    
                    {huidigThema < themas.length - 1 ? (
                      <button
                        onClick={() => { setHuidigThema(huidigThema + 1); window.scrollTo(0, 0); }}
                        style={{
                          flex: 1,
                          minWidth: '120px',
                          padding: '14px 24px',
                          borderRadius: '10px',
                          border: 'none',
                          background: thema.kleur,
                          color: 'white',
                          fontWeight: '600',
                          cursor: 'pointer'
                        }}
                      >
                        Volgende thema →
                      </button>
                    ) : (
                      <button
                        onClick={() => { setPagina('resultaten'); window.scrollTo(0, 0); }}
                        disabled={!alleVragenBeantwoord}
                        style={{
                          flex: 1,
                          minWidth: '120px',
                          padding: '14px 24px',
                          borderRadius: '10px',
                          border: 'none',
                          background: alleVragenBeantwoord 
                            ? 'linear-gradient(135deg, #1E88E5 0%, #26A69A 100%)'
                            : '#D1D5DB',
                          color: 'white',
                          fontWeight: '600',
                          cursor: alleVragenBeantwoord ? 'pointer' : 'not-allowed'
                        }}
                      >

                      </button>

                  </div>

                  {!alleVragenBeantwoord && huidigThema === themas.length - 1 && (

                    </p>

          if (pagina === 'resultaten') {

              <div style={{

                paddingBottom: '40px'
              }}>
                <div style={{

                      <div style={{

                            }}
                          >
                            <span style={{ fontWeight: '600', color: band.kleur, minWidth: '70px' }}>
                              {band.range}
                            </span>
                            <span style={{ color: '#374151', whiteSpace: 'nowrap' }}>{band.niveau}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div style={{ textAlign: 'center', marginTop: '24px' }}>
                    <button
                      onClick={() => {
                        setAntwoorden({});
                        setHuidigThema(0);
                        setPagina('intro');
                      }}
                      style={{
                        padding: '14px 32px',
                        borderRadius: '10px',
                        border: '2px solid #E5E7EB',
                        background: 'white',
                        color: '#374151',
                        fontWeight: '600',
                        cursor: 'pointer'
                      }}
                    >
                      Opnieuw beginnen
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          return null;
        }

        // Render de app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NulmetingDigitaleGeletterdheid />);
    </script>
</body>
</html>
